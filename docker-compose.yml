version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barnbuddy_postgres
    environment:
      POSTGRES_DB: barnbuddy
      POSTGRES_USER: barnbuddy
      POSTGRES_PASSWORD: barnbuddy_secret
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barnbuddy']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: barnbuddy_redis
    ports:
      - '6381:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barnbuddy_backend
    ports:
      - '3003:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: barnbuddy
      DB_USER: barnbuddy
      DB_PASSWORD: barnbuddy_secret
      DB_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
